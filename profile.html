<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPO Profile</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<nav class="topnav">
  <a class="topnav-brand" href="index.html">← CPO Intel</a>
  <select class="topnav-select" id="cpo-switcher" onchange="navigate(this.value)">
    <option value="">Loading...</option>
  </select>
</nav>

<div class="layout" id="app">
  <p style="color:#888;padding:2rem 0">Loading profile...</p>
</div>

<script>
const TAG_STYLE_MAP = {
  cpo: "b-cpo", pub: "b-pub", eu: "b-eu", signal: "b-signal", tech: "b-tech", low: "b-low"
};

const VERDICT_META = {
  "worth pursuing": { cls: "verdict-pursuing", icon: "✓" },
  "monitor":        { cls: "verdict-monitor",  icon: "◎" },
  "low priority":   { cls: "verdict-low",      icon: "–" }
};

function navigate(slug) {
  if (slug) window.location.href = `profile.html?cpo=${slug}`;
}

function rows(arr) {
  return arr.map(r => `<div class="row"><span class="rl">${r.label}</span><span class="rv">${r.value}</span></div>`).join('');
}

function card(title, content) {
  return `<div class="card"><h3>${title}</h3>${content}</div>`;
}

function alexConclusionsBlock(html, label = 'Alex Conclusions') {
  const t = html == null ? '' : String(html).trim();
  if (!t) return '';
  return `
    <section class="alex-conclusions" aria-label="${label}">
      <div class="alex-conclusions-label">${label}</div>
      <div class="alex-conclusions-body">${t}</div>
    </section>`;
}

// ── AI analysis markdown helpers ──

const AI_TABS = [
  { id: 'ai-overview',   label: 'Overview'      },
  { id: 'ai-network',    label: 'Network'       },
  { id: 'ai-product',    label: 'Product'       },
  { id: 'ai-commercial', label: 'Commercial'    },
  { id: 'ai-signals',    label: 'Signals'       },
  { id: 'ai-synthesis',  label: 'Synthesis'     },
  { id: 'ai-full',       label: 'Full Analysis' },
];

function parseAiAnalysis(md) {
  const sections = {};
  const firstH2 = md.indexOf('\n## ');
  const preamble = (firstH2 > -1 ? md.slice(0, firstH2) : md)
    .split('\n').filter(l => !l.startsWith('# ')).join('\n').trim();
  sections['_metadata'] = preamble;
  sections['_raw'] = md;
  for (const part of md.split(/\n(?=## )/)) {
    const m = part.match(/^## (.+)/);
    if (!m) continue;
    sections[m[1].trim()] = part.slice(m[0].length).trim();
  }
  return sections;
}

function renderMetadataStrip(text) {
  const fields = ['Date', 'Analyst', 'Source', 'Coverage'];
  const items = fields.map(f => {
    const m = text.match(new RegExp(`\\*\\*${f}:\\*\\*\\s*(.+)`));
    return m ? `<span class="ai-meta-item"><span class="ai-meta-label">${f}</span><span class="ai-meta-value">${m[1].trim()}</span></span>` : '';
  }).filter(Boolean);
  return items.length ? `<div class="ai-metadata-strip">${items.join('')}</div>` : '';
}

function renderAlexNotes(sections) {
  const body = sections['Alex Notes'];
  if (!body || !body.trim()) return '';
  return alexConclusionsBlock(marked.parse(body), 'Alex Notes');
}

function sectionHtml(sections, ...headings) {
  return headings
    .map(h => sections[h] ? `## ${h}\n${sections[h]}` : '')
    .filter(Boolean).join('\n\n');
}

function renderTabContent(sections, ...headings) {
  const md = sectionHtml(sections, ...headings);
  if (!md.trim()) return '<p class="muted-note" style="padding:.5rem 0">No data available for this section.</p>';
  return `<div class="ai-analysis-body card">${marked.parse(md)}</div>`;
}

function renderFullAnalysis(sections) {
  const stripped = (sections['_raw'] || '').replace(/^# .+\n/, '');
  return `<div class="ai-analysis-body card">${marked.parse(stripped)}</div>`;
}

function buildAiTabBar() {
  return `<div class="tabs">${AI_TABS.map((t, i) =>
    `<button class="tab tab-ai${i === 0 ? ' active' : ''}" data-id="${t.id}" onclick="switchAiTab('${t.id}',this)">${t.label}</button>`
  ).join('')}</div>`;
}

function switchAiTab(id, el) {
  AI_TABS.forEach(t => document.getElementById('panel-' + t.id)?.classList.remove('active'));
  document.querySelectorAll('.tab-ai').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + id)?.classList.add('active');
  if (el) el.classList.add('active');
}

async function init() {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('cpo');

  const manifest = await fetch('data/manifest.json').then(r => r.json());

  // Populate switcher
  const switcher = document.getElementById('cpo-switcher');
  switcher.innerHTML = manifest.map(m =>
    `<option value="${m.slug}" ${m.slug === slug ? 'selected' : ''}>${m.name}</option>`
  ).join('');

  if (!slug) { document.getElementById('app').innerHTML = '<p>No CPO selected.</p>'; return; }

  // Try to load the human-report JSON; fall back to AI-only mode if absent
  let d = null;
  try {
    const res = await fetch(`data/${slug}.json`);
    if (res.ok) d = await res.json();
  } catch(e) {}

  if (!d) {
    // AI-only mode — no JSON profile exists, render just the AI analysis
    const entry = manifest.find(m => m.slug === slug) || { name: slug, country: '' };
    const initials = entry.name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
    document.title = `${entry.name} — CPO Intel`;
    document.getElementById('app').innerHTML = `
      <div class="header">
        <div class="logo cpo-card-logo-ai">${initials}</div>
        <div class="header-meta">
          <h1>${entry.name}</h1>
          <div class="sub">${entry.country} &nbsp;·&nbsp; <span style="color:#7c3aed;font-weight:600">AI Analysis</span></div>
        </div>
      </div>
      <div id="panel-ai-analysis" class="panel active">
        <span class="ai-analysis-badge">AI Generated</span>
        <div id="ai-analysis-content" class="ai-analysis-body card">
          <p class="muted-note">Loading analysis…</p>
        </div>
      </div>`;
    loadAiAnalysis(slug);
    return;
  }

  document.title = `${d.name} — CPO Intel`;

  const vm = VERDICT_META[d.synthesis.verdict] || VERDICT_META["monitor"];

  const html = `
    <div class="header">
      <div class="logo">${d.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}</div>
      <div class="header-meta">
        <h1>${d.name}</h1>
        <div class="sub"><a href="https://${d.website}" target="_blank">${d.website}</a> &nbsp;·&nbsp; ${d.hq} &nbsp;·&nbsp; Last updated: ${d.lastUpdated}</div>
        <div class="badges">${d.tags.map((t,i)=>`<span class="badge ${TAG_STYLE_MAP[d.tagStyles[i]]||'b-eu'}">${t}</span>`).join('')}</div>
      </div>
    </div>

    ${alexConclusionsBlock(d.alexConclusions)}

    <div class="tabs">
      ${['overview','network','product','commercial','signals','synthesis'].map(id=>
        `<button class="tab" data-id="${id}" onclick="switchTab('${id}',this)">${id.charAt(0).toUpperCase()+id.slice(1)}</button>`
      ).join('')}
      <button class="tab tab-ai" data-id="ai-analysis" onclick="switchTab('ai-analysis',this)">AI Analysis</button>
    </div>

    <!-- OVERVIEW -->
    <div id="panel-overview" class="panel">
      <div class="stat-grid">
        ${d.stats.map(s=>`<div class="stat"><div class="stat-label">${s.label}</div><div class="stat-value">${s.value}</div><div class="stat-sub">${s.sub}</div></div>`).join('')}
      </div>
      <div class="two-col">
        ${card('Business type', rows(d.overview.businessType))}
        <div class="card">
          <h3>Countries of operation</h3>
          <div class="ctags">${d.overview.countries.map(c=>`<span class="ctag">${c}</span>`).join('')}</div>
          <div class="divider"></div>
          <div class="muted-note">${d.overview.countriesNote}</div>
        </div>
      </div>
    </div>

    <!-- NETWORK -->
    <div id="panel-network" class="panel">
      ${card('Network composition', rows(d.network.composition))}
      <div class="card">
        <h3>Roaming &amp; interoperability</h3>
        <div class="roaming-grid">
          ${d.network.roaming.map(r=>`<div class="ri"><div class="ri-name">${r.name}</div><div class="ri-desc">${r.desc}</div></div>`).join('')}
        </div>
        <div class="divider"></div>
        <div class="muted-note">${d.network.roamingNote}</div>
      </div>
      ${d.network.partnerships.length ? card('Notable partnerships', rows(d.network.partnerships)) : ''}
    </div>

    <!-- PRODUCT -->
    <div id="panel-product" class="panel">
      <div class="two-col">
        <div class="card">
          <h3>EV driver app</h3>
          ${rows(d.product.app)}
          <div class="divider"></div>
          <div class="muted-note">${d.product.appNote}</div>
        </div>
        <div class="card">
          <h3>Technology stack</h3>
          ${rows(d.product.stack)}
        </div>
      </div>
      ${card('Site host model', rows(d.product.siteHost))}
    </div>

    <!-- COMMERCIAL -->
    <div id="panel-commercial" class="panel">
      ${card('Revenue streams', rows(d.commercial.revenue))}
      ${card('Funding &amp; backing', rows(d.commercial.funding))}
      ${d.commercial.policy.length ? card('Policy &amp; industry positioning', rows(d.commercial.policy)) : ''}
    </div>

    <!-- SIGNALS -->
    <div id="panel-signals" class="panel">
      <div class="section-label">Sales signals</div>
      <div class="card">
        <ul class="signal-list">
          ${d.signals.salesSignals.map(s=>`<li><span class="si">${s.icon}</span><span>${s.text}</span></li>`).join('')}
        </ul>
      </div>
      <div class="divider"></div>
      <div class="section-label">Open questions</div>
      <div class="card">
        ${d.signals.openQuestions.map((q,i)=>`<div class="oq"><span class="qn">${String(i+1).padStart(2,'0')}</span><span>${q}</span></div>`).join('')}
      </div>
    </div>

    <!-- AI ANALYSIS -->
    <div id="panel-ai-analysis" class="panel">
      <span class="ai-analysis-badge">AI Generated</span>
      <div id="ai-analysis-content" class="ai-analysis-body card">
        <p class="muted-note">Loading analysis…</p>
      </div>
    </div>

    <!-- SYNTHESIS -->
    <div id="panel-synthesis" class="panel">
      <div class="verdict-wrap ${vm.cls}">
        <span class="verdict-icon">${vm.icon}</span>
        <div class="verdict-text"><strong>${d.synthesis.verdict.charAt(0).toUpperCase()+d.synthesis.verdict.slice(1)}.</strong> ${d.synthesis.verdictText}</div>
      </div>
      <div class="section-label">Hypotheses</div>
      ${d.synthesis.hypotheses.map(h=>`<div class="hyp"><div class="hyp-label">${h.label}</div>${h.text}</div>`).join('')}
      <div class="divider"></div>
      <div class="section-label">Key uncertainties</div>
      ${d.synthesis.uncertainties.map(u=>`<div class="unc">${u}</div>`).join('')}
      <div class="divider"></div>
      <div class="section-label">Contact strategy</div>
      ${d.synthesis.contacts.map(c=>`
        <div class="card">
          <div class="contact-wrap">
            <div class="avatar">${c.initials}</div>
            <div>
              <div style="font-size:14px;font-weight:700">${c.name}</div>
              <div style="font-size:12px;color:#888;margin-top:2px">${c.title}</div>
              <div style="font-size:13px;margin-top:4px">${c.note}</div>
            </div>
          </div>
          <div class="divider"></div>
          <div class="muted-note">${d.synthesis.contactsNote}</div>
        </div>`).join('')}
    </div>`;

  document.getElementById('app').innerHTML = html;

  // Activate tab from URL param or default to overview
  const urlTab = params.get('tab');
  if (urlTab) {
    const targetTab = document.querySelector(`.tab[data-id="${urlTab}"]`);
    if (targetTab) { switchTab(urlTab, targetTab); }
    else { const firstTab = document.querySelector('.tab'); if (firstTab) switchTab('overview', firstTab); }
  } else {
    const firstTab = document.querySelector('.tab');
    if (firstTab) switchTab('overview', firstTab);
  }

  loadAiAnalysis(slug);
}

async function loadAiAnalysis(slug) {
  const fallback = () => {
    const el = document.getElementById('ai-analysis-content');
    if (el) el.innerHTML = '<p class="muted-note">No AI analysis available for this company yet.</p>';
  };
  try {
    const res = await fetch(`data/ai-analysis/${slug}.md`);
    if (!res.ok) { fallback(); return; }
    const sections = parseAiAnalysis(await res.text());

    const panelHtml = AI_TABS.map((t, i) => {
      let content;
      if      (t.id === 'ai-full')       content = renderFullAnalysis(sections);
      else if (t.id === 'ai-overview')   content = renderTabContent(sections, 'Company Profile', 'Parent Company & Corporate Context', 'Network Size');
      else if (t.id === 'ai-network')    content = renderTabContent(sections, 'Geographic Intelligence');
      else if (t.id === 'ai-product')    content = renderTabContent(sections, 'CPMS Identification', 'App Quality');
      else if (t.id === 'ai-commercial') content = renderTabContent(sections, 'Business Model');
      else if (t.id === 'ai-signals')    content = renderTabContent(sections, 'Business Gaps', 'Competitive Position', 'Research Gaps & Unresolved');
      else if (t.id === 'ai-synthesis')  content = renderTabContent(sections, 'Synthesis', 'Strategic Context', 'Development Stage & Trajectory');
      return `<div id="panel-${t.id}" class="panel${i === 0 ? ' active' : ''}">${content}</div>`;
    }).join('');

    document.getElementById('panel-ai-analysis').innerHTML = `
      <span class="ai-analysis-badge">AI Generated</span>
      ${renderMetadataStrip(sections['_metadata'] || '')}
      ${renderAlexNotes(sections)}
      ${buildAiTabBar()}
      ${panelHtml}`;
  } catch(e) { fallback(); }
}

function switchTab(id, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  const panel = document.getElementById('panel-' + id);
  if (panel) panel.classList.add('active');
  if (el) el.classList.add('active');
  // When re-entering the AI Analysis outer tab, restore the first inner tab
  if (id === 'ai-analysis') {
    document.getElementById('panel-ai-overview')?.classList.add('active');
    document.querySelector('[data-id="ai-overview"]')?.classList.add('active');
  }
}

init();
</script>
<!-- Optional: <script>window.VISITOR_TRACKER={ allowedCountry:'BG', allowedIps:[], notifyUrl:'' };</script> -->
<script src="assets/visitor-tracker.js"></script>
</body>
</html>
