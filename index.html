<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPO Intelligence</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .index-header { margin-bottom: 2rem; }
  .index-header h1 { font-size: 28px; font-weight: 700; }
  .index-header p { color: #666; font-size: 14px; margin-top: 6px; }
  .verdict-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot-pursuing { background: #22c55e; }
  .dot-monitor  { background: #eab308; }
  .dot-low      { background: #94a3b8; }
</style>
</head>
<body>

<nav class="topnav">
  <span class="topnav-brand">CPO Intel</span>
</nav>

<div class="layout">
  <div class="index-header">
    <h1>CPO Research</h1>
    <p>Select a company to view the full profile.</p>
  </div>
  <div class="view-toggle">
    <button class="vtoggle" onclick="setView('human',this)">Human Reports</button>
    <button class="vtoggle active" onclick="setView('ai',this)">AI Analysis</button>
  </div>
  <div class="cpo-grid" id="grid-human" style="display:none"></div>
  <div class="cpo-grid" id="grid-ai"></div>
</div>

<script>
const VERDICT_META = {
  "worth pursuing": { cls: "dot-pursuing", label: "Worth pursuing" },
  "monitor":        { cls: "dot-monitor",  label: "Monitor" },
  "low priority":   { cls: "dot-low",      label: "Low priority" }
};

const TAG_STYLE_MAP = {
  cpo: "b-cpo", pub: "b-pub", eu: "b-eu", signal: "b-signal", tech: "b-tech", low: "b-low"
};

function setView(view, el) {
  document.querySelectorAll('.vtoggle').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('grid-human').style.display = view === 'human' ? '' : 'none';
  document.getElementById('grid-ai').style.display = view === 'ai' ? '' : 'none';
}

async function init() {
  const res = await fetch('data/manifest.json');
  const manifest = await res.json();
  const humanGrid = document.getElementById('grid-human');
  const aiGrid = document.getElementById('grid-ai');
  let aiCount = 0;

  for (const item of manifest) {
    const initials = item.name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();

    if (item.status !== 'ai-only') {
      const data = await fetch(`data/${item.slug}.json`).then(r => r.json());
      const vm = VERDICT_META[data.synthesis.verdict] || { cls: "dot-monitor", label: data.synthesis.verdict };

      const card = document.createElement('a');
      card.className = 'cpo-card';
      card.href = `profile.html?cpo=${item.slug}`;
      card.innerHTML = `
        <div class="cpo-card-logo">${initials}</div>
        <div class="cpo-card-name">${item.name}</div>
        <div class="cpo-card-sub">${item.country} · ${data.type}</div>
        <div class="badges" style="margin-bottom:10px">
          ${data.tags.map((t,i) => `<span class="badge ${TAG_STYLE_MAP[data.tagStyles[i]] || 'b-eu'}">${t}</span>`).join('')}
        </div>
        <div style="font-size:12px;color:#555">
          <span class="verdict-dot ${vm.cls}"></span>${vm.label}
        </div>`;
      humanGrid.appendChild(card);
    }

    if (item.hasAiAnalysis) {
      aiCount++;
      const aiCard = document.createElement('a');
      aiCard.className = 'cpo-card';
      aiCard.href = `profile.html?cpo=${item.slug}&tab=ai-analysis`;
      aiCard.innerHTML = `
        <div class="cpo-card-logo cpo-card-logo-ai">${initials}</div>
        <div class="cpo-card-name">${item.name}</div>
        <div class="cpo-card-sub">${item.country}</div>
        <span class="ai-card-tag">AI Analysis</span>`;
      aiGrid.appendChild(aiCard);
    }
  }

  if (aiCount === 0) {
    aiGrid.innerHTML = '<p class="ai-grid-empty">No AI analyses uploaded yet — add <code>.md</code> files to <code>data/ai-analysis/</code> and set <code>hasAiAnalysis: true</code> in manifest.json.</p>';
  }
}

init();
</script>
<!-- Optional: <script>window.VISITOR_TRACKER={ allowedCountry:'BG', allowedIps:[], notifyUrl:'' };</script> -->
<script src="assets/visitor-tracker.js"></script>
</body>
</html>
